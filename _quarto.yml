project:
  type: website
  output-dir: _site

website:
  page-navigation: true
  title: "CSC477 - Fall 2026"
  description: "Schedule, lecture slides, tutorials, and assignments."
  site-url: "https://csc477.github.io/2026F_website"

  repo-url: https://github.com/csc477/2026F_website
  repo-actions: [issue]

  open-graph: true

  twitter-card:
    card-style: "summary" 

  page-footer:
    right: "This page is built with ❤️, [Quarto](https://quarto.org/) and inspiration from [STA210](https://sta210-s22.github.io/website/)."
    left: "&copy; Copyright 2026, Florian Shkurti"
    background: "#D9E3E4"

  sidebar:
    background: "#D9E3E4"
    logo: "images/mars-exploration-rover.png"
    pinned: true
    align: center
    title: "CSC477: Introduction to Mobile Robotics"
    
    tools:
      - icon: github
        href: https://github.com/csc477 
        text: "Github workspace for the course"
      - icon: chat-quote
        href: http://piazza.com/utoronto.ca/fall2022/csc477
        text: "Discuss on Piazza"
      - icon: megaphone
        href: http://toolboxrenewal.utoronto.ca/
        text: "Official announcements on Quercus"
      - icon: envelope-at
        href: index.html#teaching-staff
        text: "Email teaching staff"
   	
        
    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Overview
      - href: index.qmd#teaching-staff
        text: Teaching Staff
      - href: index.qmd#schedule
        text: Schedule
      - href: http://piazza.com/utoronto.ca/fall2022/csc477
        text: Piazza
      - href: http://toolboxrenewal.utoronto.ca/
        text: Quercus
      - href: final_project.qmd
        text: Final Project
      # - href: course-syllabus.qmd
      #   text: Syllabus
      
format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    mainfont: "Atkinson Hyperlegible"
    code-copy: true
    code-overflow: wrap
    toc: true
    
freeze: auto

editor: visual
script: [/lecs/w01/custom.js]